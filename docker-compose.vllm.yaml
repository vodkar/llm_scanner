services:
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.31.0}
    container_name: llm_scanner_vllm
    # Defaults serve Gemma 4 12B (QAT w4a16) on a 16 GB GPU, tuned for
    # self-consistency judging: each request asks for n completions, so
    # prefix caching encodes the prompt once and forks it; max-num-seqs must
    # cover concurrency * n (8 * 3 = 24); CUDA graphs (no --enforce-eager) speed up decode.
    command: >
      --model ${MODEL:-google/gemma-4-12B-it-qat-w4a16-ct}
      --reasoning-parser ${REASONING_PARSER:-gemma4}
      --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8}
      --max-model-len ${MAX_MODEL_LEN:-24576}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.92}
      --max-num-seqs ${MAX_NUM_SEQS:-24}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-4096}
      --enable-prefix-caching
      --limit-mm-per-prompt '{"image": 0, "audio": 0}'
      --generation-config auto
      --dtype ${DTYPE:-auto}
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HOME=/app/.cache/huggingface
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - huggingface_cache:/app/.cache/huggingface
      - torch_cache:/app/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 600s

volumes:
  huggingface_cache:
    driver_opts:
      type: none
      o: bind
      device: /var/opt/huggingface_cache
  torch_cache:
    driver_opts:
      type: none
      o: bind
      device: /var/opt/torch_cache
